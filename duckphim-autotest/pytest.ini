[pytest]
# Cho phép import kiểu "from config.settings import ..." từ thư mục gốc
pythonpath = .
# pytest chỉ tìm test trong folder tests
testpaths = tests
# -v: in rõ tên từng test và kết quả PASSED/FAILED
addopts = -v
# Khai báo nhãn (marker) để lọc test, ví dụ: pytest -m smoke
markers =
    smoke: test quan trọng nhất, chạy nhanh để biết web còn sống không
    api: test API bằng requests
    ui: test giao diện bằng Selenium